name: Keploy API CI

on:
  push:
    branches: CustomAPI
  pull_request:
    branches: CustomAPI

jobs:
  keploy-api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'         # Change this if you're using Java 8/11/21
          distribution: 'temurin'

      - name: Build Spring Boot App
        run: |
          ./mvnw spring-boot:run &
          sleep 10                   # Give app time to start

      - name: Install Keploy CLI
        run: |
          curl --silent -L https://keploy.io/ent/install.sh | bash

      - name: Run Keploy Test Suite
        run: |
          export KEPLOY_API_KEY=SUylEGNNfWLABwDzHw== && keploy test-suite --app=e83310d8-23ca-4b85-9977-391437c7f921 --base-path http://localhost:8970/api/employees --cloud
